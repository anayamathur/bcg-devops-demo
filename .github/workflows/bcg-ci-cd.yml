name: BCG CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  actions: write
  id-token: write

env:
  JFROG_ARTIFACTORY_URL: ${{ secrets.JFROG_ARTIFACTORY_URL }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  ARGOCD_URL: ${{ secrets.ARGOCD_URL }}
  ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
  ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
  DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Snyk Security Scan
        uses: snyk/actions/python@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: test --severity-threshold=medium

  sonar-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v1.8
        with:
          args: >
            -Dsonar.projectKey=anayamathur_bcg-devops-demo
            -Dsonar.sources=.
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, security-scan, sonar-scan]
    if: github.ref =='refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context:.
          push: true
          tags: ${{ secrets.JFROG_ARTIFACTORY_URL }}/bcg-devops-demo:latest

      - name: ArgoCD Application Set
        uses: argocd/argocd-github-action@v2
        with:
          argocd_url: ${{ secrets.ARGOCD_URL }}
          username: ${{ secrets.ARGOCD_USERNAME }}
          password: ${{ secrets.ARGOCD_PASSWORD }}
          app_name: bcg-devops-demo
          manifest: |
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            metadata:
              name: bcg-devops-demo
            spec:
              source:
                repoURL: 'https://github.com/anayamathur/bcg-devops-demo.git'
                targetRevision: HEAD
                path: k8s
              destination:
                server: 'https://kubernetes.default.svc'
                namespace: default
              project: default

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          payload: |
            {
              "text": "Deployment successful!",
              "attachments": [
                {
                  "color": "#36a64f",
                  "fields": [
                    {
                      "title": "Repository",
                      "value": "anayamathur/bcg-devops-demo",
                      "short": false
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.ref }}",
                      "short": false
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Datadog Metrics
        uses: gaurav-nelson/github-action-datadog@v1
        with:
          api-key: ${{ secrets.DATADOG_API_KEY }}
          application-key: ${{ secrets.DATADOG_APP_KEY }}
          metric-name: github.actions.deployment
          metric-value: 1
          metric-type: count
          tags: "repository:anayamathur/bcg-devops-demo,branch:${{ github.ref }}"