name: BCG CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  actions: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Snyk Security Scan
        uses: snyk/actions/python@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: test

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v1
        with:
          args: >
            -Dsonar.projectKey=anayamathur_bcg-devops-demo
            -Dsonar.sources=.
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  deploy:
    needs: [build, security-scan, code-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref =='refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context:.
          push: true
          tags: ${{ secrets.JFROG_REGISTRY }}/bcg-devops-demo:latest
          build-args: |
            JFROG_USER=${{ secrets.JFROG_USER }}
            JFROG_PASSWORD=${{ secrets.JFROG_PASSWORD }}

      - name: Deploy via ArgoCD
        uses: argocd/argocd-github-action@v2
        with:
          manifest: |
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            metadata:
              name: bcg-devops-demo
            spec:
              destination:
                server: https://kubernetes.default.svc
                namespace: argocd
              source:
                repoURL: https://github.com/anayamathur/bcg-devops-demo.git
                targetRevision: HEAD
                path: manifests
              project: default
              syncPolicy:
                automated:
                  prune: true
                  selfHeal: true
        env:
          ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
          ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          payload: |
            {
              "text": "Deployment successful! :tada:"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  monitor:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Monitor with Datadog
        uses: DataDog/datadog-github-action@v2
        with:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
          DATADOG_SITE: datadoghq.com
          EVENT_TITLE: "Deployment completed"
          EVENT_TEXT: "The deployment of bcg-devops-demo has been completed."