name: BCG CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  checks: write
  deployments: write
  packages: write

env:
  JFROG_ARTIFACTORY_URL: ${{ secrets.JFROG_ARTIFACTORY_URL }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  ARGOCD_URL: ${{ secrets.ARGOCD_URL }}
  ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
  ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
  DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Snyk Security Scan
        uses: snyk/actions@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: test --severity-threshold=high

  sonar-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v1.8
        with:
          args: >
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, security-scan, sonar-analysis]
    if: github.ref =='refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.JFROG_ARTIFACTORY_URL }}/bcg-devops-demo:latest.
          docker login -u ${{ secrets.JFROG_USERNAME }} -p ${{ secrets.JFROG_PASSWORD }} ${{ env.JFROG_ARTIFACTORY_URL }}
          docker push ${{ env.JFROG_ARTIFACTORY_URL }}/bcg-devops-demo:latest

      - name: Deploy to ArgoCD
        uses: argocd/argocd-github-action@v2
        with:
          argocd_url: ${{ secrets.ARGOCD_URL }}
          username: ${{ secrets.ARGOCD_USERNAME }}
          password: ${{ secrets.ARGOCD_PASSWORD }}
          app_name: bcg-devops-demo
          sync: true

  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [deploy]
    if: success()
    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          payload: |
            {
              "text": "Deployment successful! :tada:"
            }
          channel: '#general'
          username: 'GitHub Actions'
          icon_emoji: ':github:'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  datadog-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Monitor with Datadog
        uses: DataDog/datadog-github-action@v2
        with:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          COMMAND: "emit-point"
          METRIC_NAME: "github.actions.ci.duration"
          METRIC_VALUE: 1
          METRIC_TAGS: "env:production"