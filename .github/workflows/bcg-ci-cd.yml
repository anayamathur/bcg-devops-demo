name: BCG CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Snyk Security Scan
        uses: snyk/actions/python@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: test --severity-threshold=medium

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v1.8
        with:
          args: >
            -Dsonar.projectKey=anayamathur_bcg-devops-demo
            -Dsonar.sources=.
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  deploy:
    needs: [build, security-scan, code-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref =='refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t bcg-devops-demo.
          docker tag bcg-devops-demo:latest ${{ secrets.JFROG_REGISTRY }}/bcg-devops-demo:latest

      - name: Login to JFrog Artifactory
        run: echo ${{ secrets.JFROG_PASSWORD }} | docker login ${{ secrets.JFROG_REGISTRY }} -u ${{ secrets.JFROG_USERNAME }} --password-stdin

      - name: Push Docker image to JFrog Artifactory
        run: docker push ${{ secrets.JFROG_REGISTRY }}/bcg-devops-demo:latest

      - name: Deploy to ArgoCD
        uses: argocd/argocd-github-action@v2
        with:
          manifest: |
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            metadata:
              name: bcg-devops-demo
            spec:
              source:
                repoURL: https://github.com/anayamathur/bcg-devops-demo
                targetRevision: HEAD
                path: k8s
              destination:
                server: https://kubernetes.default.svc
                namespace: default
              syncPolicy:
                automated:
                  prune: true
                  selfHeal: true
                syncOptions:
                  - CreateNamespace=true
          argocd_url: ${{ secrets.ARGOCD_URL }}
          argocd_username: ${{ secrets.ARGOCD_USERNAME }}
          argocd_password: ${{ secrets.ARGOCD_PASSWORD }}

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          payload: |
            {
              "text": "Deployment successful! :tada:"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  monitor:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Monitor with Datadog
        run: |
          curl -X POST "https://api.datadoghq.com/api/v1/events" \
          -H "Content-Type: application/json" \
          -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
          -d '{
            "title": "Deployment completed",
            "text": "The deployment of bcg-devops-demo has been completed.",
            "tags": ["deployment", "bcg-devops-demo"]
          }'