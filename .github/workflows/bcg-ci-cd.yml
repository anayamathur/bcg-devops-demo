name: BCG CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  actions: write
  id-token: write

env:
  JFROG_ARTIFACTORY_URL: ${{ secrets.JFROG_ARTIFACTORY_URL }}
  SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
  ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
  DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Snyk Security Scan
        uses: snyk/actions/python@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --org=your-org --project-name=bcg-devops-demo --fail-on=high

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v1
        with:
          args: >
            -Dsonar.projectKey=bcg-devops-demo
            -Dsonar.sources=.
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONARQUBE_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, security-scan, code-quality]
    if: github.ref =='refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to JFrog Artifactory
        uses: jfrog/setup-jfrog-cli@v2
        with:
          artifactory-url: ${{ env.JFROG_ARTIFACTORY_URL }}
          username: ${{ secrets.JFROG_USERNAME }}
          password: ${{ secrets.JFROG_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.JFROG_ARTIFACTORY_URL }}/bcg-devops-demo:latest.
          jfrog rt docker-push ${{ env.JFROG_ARTIFACTORY_URL }}/bcg-devops-demo:latest

      - name: Deploy to ArgoCD
        uses: argocd/argocd-github-action@v2
        with:
          argocd_url: 'https://argocd.example.com'
          username: ${{ env.ARGOCD_USERNAME }}
          password: ${{ env.ARGOCD_PASSWORD }}
          app_name: bcg-devops-demo
          sync: true

      - name: Monitor with Datadog
        run: |
          curl -X POST -H "Content-Type: application/json" --data '{"api_key":"'${{ secrets.DATADOG_API_KEY }}'","series":[{"metric":"custom.bcg.deployment","points":[['$(date +%s)',1]],"type":"gauge","host":"bcg-devops-demo","tags":["env:production"]}]}' -H "Content-type: application/json" https://api.datadoghq.com/api/v1/series

      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          payload: |
            {
              "text": "Deployment of bcg-devops-demo to production completed successfully!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}