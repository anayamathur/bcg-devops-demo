# Golang CI/CD Workflow Template
# BCG DevOps Standards Compliant
# Integrated: JFrog Artifactory, Prisma Cloud, SonarQube, Datadog, ArgoCD, Octopus, Slack

name: Go CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.22'
  JFROG_REGISTRY: ${{ secrets.JFROG_ARTIFACTORY_URL }}
  JFROG_REPO: 'docker-local'
  IMAGE_NAME: ${{ github.repository }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  # ============================================
  # Code Quality & Testing
  # ============================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarQube
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      # Configure JFrog for Go modules
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://${{ secrets.JFROG_ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JFROG_ACCESS_TOKEN }}
      
      - name: Configure Go proxy via JFrog
        run: |
          go env -w GOPROXY="https://${{ secrets.JFROG_ARTIFACTORY_URL }}/artifactory/api/go/go-remote,direct"
          go env -w GONOSUMDB="*"
      
      - name: Verify dependencies
        run: go mod verify
      
      - name: Run go vet
        run: go vet ./...
      
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m
      
      - name: Run tests with coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/vendor/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
      
      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================
  # Security Scanning - Prisma Cloud + Trivy + Gosec
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      # Gosec - Go Security Scanner
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: -fmt sarif -out gosec-results.sarif ./...
        continue-on-error: true
      
      - name: Upload Gosec results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'gosec-results.sarif'
        continue-on-error: true
      
      # Prisma Cloud SAST Scan
      - name: Prisma Cloud SAST Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: all
          output_format: sarif
          output_file_path: prisma-sast-results.sarif
          soft_fail: false
        env:
          PRISMA_API_URL: ${{ secrets.PRISMA_API_URL }}
          BC_API_KEY: ${{ secrets.PRISMA_ACCESS_KEY }}
      
      # Prisma Cloud SCA (Software Composition Analysis)
      - name: Prisma Cloud SCA Scan
        run: |
          curl -L -o checkov https://github.com/bridgecrewio/checkov/releases/latest/download/checkov_linux_amd64
          chmod +x checkov
          ./checkov -f go.mod --framework sca_package --bc-api-key ${{ secrets.PRISMA_ACCESS_KEY }} --repo-id ${{ github.repository }} --branch ${{ github.ref_name }}
        continue-on-error: true
      
      # Trivy filesystem scan
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      
      # Go vulnerability check
      - name: Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true

  # ============================================
  # Build & Push to JFrog Artifactory
  # ============================================
  build:
    name: Build & Push to JFrog
    needs: [quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'
    
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_full: ${{ env.JFROG_REGISTRY }}/${{ env.JFROG_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ github.sha }}" -o app .
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # JFrog CLI Setup
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://${{ secrets.JFROG_ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JFROG_ACCESS_TOKEN }}
      
      - name: Configure JFrog Docker Registry
        run: |
          jf docker-config --server-id-resolve=jfrog-server --server-id-deploy=jfrog-server --repo-resolve=${{ env.JFROG_REPO }} --repo-deploy=${{ env.JFROG_REPO }}
      
      # Login to JFrog Artifactory Docker Registry
      - name: Login to JFrog Artifactory
        uses: docker/login-action@v3
        with:
          registry: ${{ env.JFROG_REGISTRY }}
          username: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_ACCESS_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.JFROG_REGISTRY }}/${{ env.JFROG_REPO }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Prisma Cloud Container Scan
      - name: Prisma Cloud Container Scan
        uses: PaloAltoNetworks/prisma-cloud-scan@v1
        with:
          pcc_console_url: ${{ secrets.PRISMA_CONSOLE_URL }}
          pcc_user: ${{ secrets.PRISMA_ACCESS_KEY }}
          pcc_pass: ${{ secrets.PRISMA_SECRET_KEY }}
          image_name: ${{ env.JFROG_REGISTRY }}/${{ env.JFROG_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
      
      # JFrog Xray Scan
      - name: JFrog Xray Scan
        run: |
          jf docker scan ${{ env.JFROG_REGISTRY }}/${{ env.JFROG_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        continue-on-error: true
      
      - name: Push to JFrog Artifactory
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Publish build info to JFrog
      - name: Publish Build Info
        run: |
          jf rt build-publish ${{ github.repository }} ${{ github.run_number }}

  # ============================================
  # Deploy to Development (EKS via ArgoCD)
  # ============================================
  deploy-dev:
    name: Deploy to Dev (EKS)
    needs: [build]
    runs-on: ubuntu-latest
    environment: development
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }}-dev --region ${{ env.AWS_REGION }}
      
      # Update ArgoCD Application
      - name: Update ArgoCD Application
        run: |
          # Install ArgoCD CLI
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          
          # Login to ArgoCD
          ./argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure
          
          # Update image tag
          ./argocd app set ${{ github.event.repository.name }}-dev \
            --helm-set image.repository=${{ env.JFROG_REGISTRY }}/${{ env.JFROG_REPO }}/${{ env.IMAGE_NAME }} \
            --helm-set image.tag=${{ needs.build.outputs.image_tag }}
          
          # Sync application
          ./argocd app sync ${{ github.event.repository.name }}-dev --prune
          
          # Wait for rollout
          ./argocd app wait ${{ github.event.repository.name }}-dev --timeout 300
      
      # Register deployment with Datadog
      - name: Datadog Deployment Tracking
        run: |
          curl -X POST "https://api.datadoghq.com/api/v2/dora/deployment" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
            -d '{
              "data": {
                "attributes": {
                  "started_at": "'$(date -u +%s)'000000000",
                  "finished_at": "'$(date -u +%s)'000000000",
                  "git": {
                    "commit_sha": "${{ github.sha }}",
                    "repository_url": "https://github.com/${{ github.repository }}"
                  },
                  "service": "${{ github.event.repository.name }}",
                  "version": "${{ needs.build.outputs.image_tag }}",
                  "env": "development"
                }
              }
            }'
      
      - name: Notify Slack - Dev Deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,workflow,job
          text: ':rocket: Development deployment ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================
  # Deploy to Production (EKS via ArgoCD + Octopus)
  # ============================================
  deploy-prod:
    name: Deploy to Prod (EKS)
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }}-prod --region ${{ env.AWS_REGION }}
      
      # Trigger Octopus Deploy for production
      - name: Trigger Octopus Deploy
        run: |
          curl -X POST "${{ secrets.OCTOPUS_SERVER_URL }}/api/deployments" \
            -H "X-Octopus-ApiKey: ${{ secrets.OCTOPUS_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "ReleaseId": "${{ secrets.OCTOPUS_RELEASE_ID }}",
              "ProjectId": "${{ secrets.OCTOPUS_PROJECT_ID }}",
              "EnvironmentId": "${{ secrets.OCTOPUS_PROD_ENV_ID }}",
              "SpecificMachineIds": [],
              "ForcePackageDownload": false,
              "ForcePackageRedeployment": false,
              "FormValues": {
                "ImageTag": "${{ needs.build.outputs.image_tag }}",
                "ImageRepository": "${{ env.JFROG_REGISTRY }}/${{ env.JFROG_REPO }}/${{ env.IMAGE_NAME }}"
              }
            }'
      
      # Update ArgoCD Application
      - name: Update ArgoCD Application
        run: |
          # Install ArgoCD CLI
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          
          # Login to ArgoCD
          ./argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure
          
          # Update image tag
          ./argocd app set ${{ github.event.repository.name }}-prod \
            --helm-set image.repository=${{ env.JFROG_REGISTRY }}/${{ env.JFROG_REPO }}/${{ env.IMAGE_NAME }} \
            --helm-set image.tag=${{ needs.build.outputs.image_tag }}
          
          # Sync application with canary strategy
          ./argocd app sync ${{ github.event.repository.name }}-prod --prune --strategy apply
          
          # Wait for rollout
          ./argocd app wait ${{ github.event.repository.name }}-prod --timeout 600
      
      # Register deployment with Datadog
      - name: Datadog Deployment Tracking
        run: |
          curl -X POST "https://api.datadoghq.com/api/v2/dora/deployment" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
            -d '{
              "data": {
                "attributes": {
                  "started_at": "'$(date -u +%s)'000000000",
                  "finished_at": "'$(date -u +%s)'000000000",
                  "git": {
                    "commit_sha": "${{ github.sha }}",
                    "repository_url": "https://github.com/${{ github.repository }}"
                  },
                  "service": "${{ github.event.repository.name }}",
                  "version": "${{ needs.build.outputs.image_tag }}",
                  "env": "production"
                }
              }
            }'
      
      # Create Datadog Event for deployment
      - name: Datadog Deployment Event
        run: |
          curl -X POST "https://api.datadoghq.com/api/v1/events" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
            -d '{
              "title": "Production Deployment: ${{ github.event.repository.name }}",
              "text": "Deployed version ${{ needs.build.outputs.image_tag }} to production",
              "priority": "normal",
              "tags": ["environment:production", "service:${{ github.event.repository.name }}", "version:${{ needs.build.outputs.image_tag }}"],
              "alert_type": "info"
            }'
      
      - name: Notify Slack - Prod Deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,workflow,job
          text: ':rocket: *PRODUCTION* deployment ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================
  # Post-Deployment Smoke Tests
  # ============================================
  smoke-tests:
    name: Smoke Tests
    needs: [deploy-prod]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run smoke tests
        run: |
          # Add your smoke test commands here
          echo "Running smoke tests against production..."
          # curl -f https://your-app.example.com/health || exit 1
      
      - name: Notify Datadog - Smoke Test Results
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ALERT_TYPE="info"
          if [ "$STATUS" != "success" ]; then
            ALERT_TYPE="error"
          fi
          
          curl -X POST "https://api.datadoghq.com/api/v1/events" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
            -d '{
              "title": "Smoke Tests: ${{ github.event.repository.name }}",
              "text": "Smoke tests ${{ job.status }} for version ${{ needs.build.outputs.image_tag }}",
              "priority": "normal",
              "tags": ["environment:production", "service:${{ github.event.repository.name }}", "test:smoke"],
              "alert_type": "'$ALERT_TYPE'"
            }'
      
      - name: Notify Slack - Smoke Test Results
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,workflow,job
          text: ':warning: Smoke tests failed in production!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
