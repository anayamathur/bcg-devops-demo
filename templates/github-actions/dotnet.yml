# BCG .NET CI/CD Pipeline - GitHub Actions
# Generated by BCG DevOps GenAI POC
# Compliant with BCG security and quality standards
#
# Required Secrets:
#   - JFROG_URL: JFrog Artifactory URL
#   - JFROG_USER: JFrog username
#   - JFROG_API_KEY: JFrog API key
#   - PRISMA_API_URL: Prisma Cloud API URL
#   - PRISMA_ACCESS_KEY: Prisma Cloud access key
#   - PRISMA_SECRET_KEY: Prisma Cloud secret key
#   - SONAR_TOKEN: SonarQube authentication token
#   - SONAR_HOST_URL: SonarQube server URL
#   - DATADOG_API_KEY: Datadog API key
#   - ARGOCD_SERVER: ArgoCD server URL
#   - ARGOCD_AUTH_TOKEN: ArgoCD authentication token
#   - OCTOPUS_SERVER_URL: Octopus Deploy server URL
#   - OCTOPUS_API_KEY: Octopus Deploy API key
#   - SLACK_WEBHOOK_URL: Slack webhook for notifications
#   - DOCKER_REGISTRY: Container registry URL
#   - DOCKER_USERNAME: Container registry username
#   - DOCKER_PASSWORD: Container registry password

name: BCG .NET CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/**', 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  SOLUTION_FILE: '*.sln'
  PROJECT_NAME: ${{ github.event.repository.name }}
  DOCKER_IMAGE: ${{ secrets.DOCKER_REGISTRY }}/${{ github.event.repository.name }}

jobs:
  # ============================================
  # PRE-FLIGHT CHECKS
  # ============================================
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      environment: ${{ steps.check.outputs.environment }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine deployment context
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "environment=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Generate version
        id: version
        run: |
          # Generate semantic version based on git history
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/[^a-zA-Z0-9]/-/g')
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION="1.${COMMIT_COUNT}.0"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            VERSION="1.${COMMIT_COUNT}.0-rc.${SHORT_SHA}"
          else
            VERSION="1.${COMMIT_COUNT}.0-${BRANCH_NAME}.${SHORT_SHA}"
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

  # ============================================
  # SECRET SCANNING - GITLEAKS
  # ============================================
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload Gitleaks results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: results.sarif
          retention-days: 30

  # ============================================
  # BUILD AND TEST
  # ============================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [preflight, secret-scanning]
    outputs:
      test_coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Configure JFrog NuGet source
        run: |
          dotnet nuget add source "${{ secrets.JFROG_URL }}/api/nuget/v3/nuget-remote" \
            --name JFrog \
            --username "${{ secrets.JFROG_USER }}" \
            --password "${{ secrets.JFROG_API_KEY }}" \
            --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: |
          dotnet build --no-restore \
            --configuration Release \
            /p:Version=${{ needs.preflight.outputs.version }} \
            /p:TreatWarningsAsErrors=true

      - name: Run unit tests
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          dotnet test --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Generate coverage report
        id: coverage
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:./TestResults/**/coverage.opencover.xml \
            -targetdir:./coverage-report \
            -reporttypes:"Html;Cobertura;TextSummary"
          
          # Extract coverage percentage
          COVERAGE=$(grep -oP 'Line coverage: \K[0-9.]+' ./coverage-report/Summary.txt || echo "0")
          echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "Code coverage: ${COVERAGE}%"

      - name: Upload test results
        if: always() && github.event.inputs.skip_tests != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ./TestResults
            ./coverage-report
          retention-days: 30

      - name: Publish test results
        if: always() && github.event.inputs.skip_tests != 'true'
        uses: dorny/test-reporter@v1
        with:
          name: .NET Tests
          path: ./TestResults/*.trx
          reporter: dotnet-trx

      - name: Check coverage threshold
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          THRESHOLD=80
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Code coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Publish artifacts
        run: |
          dotnet publish --no-build \
            --configuration Release \
            --output ./publish \
            /p:Version=${{ needs.preflight.outputs.version }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-publish
          path: ./publish
          retention-days: 5

  # ============================================
  # CODE QUALITY - SONARQUBE
  # ============================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: ./TestResults

      - name: Install SonarScanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Configure JFrog NuGet source
        run: |
          dotnet nuget add source "${{ secrets.JFROG_URL }}/api/nuget/v3/nuget-remote" \
            --name JFrog \
            --username "${{ secrets.JFROG_USER }}" \
            --password "${{ secrets.JFROG_API_KEY }}" \
            --store-password-in-clear-text

      - name: Begin SonarQube analysis
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.PROJECT_NAME }}" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="./TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="./TestResults/*.trx" \
            /d:sonar.coverage.exclusions="**/*Tests*/**,**/Migrations/**" \
            /d:sonar.qualitygate.wait=true

      - name: Build for analysis
        run: dotnet build --configuration Release

      - name: End SonarQube analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # ============================================
  # SECURITY SCANNING - PRISMA CLOUD
  # ============================================
  prisma-sast:
    name: Prisma Cloud SAST
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Prisma Cloud SAST
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: sast
          output_format: cli,sarif
          output_file_path: console,prisma-sast-results.sarif
          soft_fail: false

      - name: Upload SAST results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: prisma-sast-results.sarif

  prisma-sca:
    name: Prisma Cloud SCA
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Prisma Cloud SCA
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: sca_package
          output_format: cli,sarif
          output_file_path: console,prisma-sca-results.sarif
          soft_fail: false

      - name: Upload SCA results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: prisma-sca-results.sarif

  # ============================================
  # DEPENDENCY VULNERABILITY SCAN
  # ============================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run NuGet vulnerability scan
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          
          # Check for high/critical vulnerabilities
          if grep -q "High\|Critical" vulnerability-report.txt; then
            echo "::error::High or Critical vulnerabilities found in dependencies"
            exit 1
          fi

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: vulnerability-report.txt
          retention-days: 30

  # ============================================
  # CONTAINER BUILD AND SCAN
  # ============================================
  container-build:
    name: Container Build and Scan
    runs-on: ubuntu-latest
    needs: [preflight, build, sonarqube, prisma-sast, prisma-sca]
    if: needs.preflight.outputs.should_deploy == 'true'
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dotnet-publish
          path: ./publish

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          # BCG .NET Container - Multi-stage build
          FROM mcr.microsoft.com/dotnet/aspnet:8.0-alpine AS base
          WORKDIR /app
          EXPOSE 8080
          EXPOSE 8443
          
          # Security hardening
          RUN addgroup -g 1000 appgroup && \
              adduser -u 1000 -G appgroup -D appuser && \
              chown -R appuser:appgroup /app
          
          # Copy published application
          COPY --chown=appuser:appgroup ./publish .
          
          USER appuser
          
          # Health check
          HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
            CMD wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1
          
          ENTRYPOINT ["dotnet", "*.dll"]
          EOF
          
          # Update ENTRYPOINT with actual DLL name
          DLL_NAME=$(ls ./publish/*.dll | head -1 | xargs basename)
          sed -i "s/\*\.dll/${DLL_NAME}/" Dockerfile

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ needs.preflight.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ needs.preflight.outputs.version }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Run Prisma Cloud container scan
        uses: PaloAltoNetworks/prisma-cloud-scan@v1
        with:
          pcc_console_url: ${{ secrets.PRISMA_API_URL }}
          pcc_user: ${{ secrets.PRISMA_ACCESS_KEY }}
          pcc_pass: ${{ secrets.PRISMA_SECRET_KEY }}
          image_name: '${{ env.DOCKER_IMAGE }}:${{ needs.preflight.outputs.version }}'

  # ============================================
  # PUBLISH TO JFROG ARTIFACTORY
  # ============================================
  publish-artifacts:
    name: Publish to JFrog
    runs-on: ubuntu-latest
    needs: [preflight, build, container-build]
    if: needs.preflight.outputs.should_deploy == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JFROG_URL }}
          JF_USER: ${{ secrets.JFROG_USER }}
          JF_PASSWORD: ${{ secrets.JFROG_API_KEY }}

      - name: Build NuGet package
        run: |
          dotnet pack --configuration Release \
            --output ./packages \
            /p:Version=${{ needs.preflight.outputs.version }} \
            /p:PackageVersion=${{ needs.preflight.outputs.version }}

      - name: Publish to JFrog NuGet
        run: |
          jf rt upload \
            "./packages/*.nupkg" \
            "nuget-local/${{ env.PROJECT_NAME }}/" \
            --build-name="${{ env.PROJECT_NAME }}" \
            --build-number="${{ github.run_number }}"

      - name: Collect build info
        run: |
          jf rt build-collect-env "${{ env.PROJECT_NAME }}" "${{ github.run_number }}"
          jf rt build-add-git "${{ env.PROJECT_NAME }}" "${{ github.run_number }}"
          jf rt build-publish "${{ env.PROJECT_NAME }}" "${{ github.run_number }}"

      - name: Scan with JFrog Xray
        run: |
          jf rt build-scan "${{ env.PROJECT_NAME }}" "${{ github.run_number }}"

  # ============================================
  # DEPLOY WITH ARGOCD
  # ============================================
  deploy-argocd:
    name: Deploy with ArgoCD
    runs-on: ubuntu-latest
    needs: [preflight, container-build, publish-artifacts]
    if: needs.preflight.outputs.should_deploy == 'true'
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops-config
          token: ${{ secrets.GITHUB_TOKEN }}
          path: gitops

      - name: Update image tag in GitOps repo
        run: |
          cd gitops
          ENV="${{ needs.preflight.outputs.environment }}"
          VERSION="${{ needs.preflight.outputs.version }}"
          
          # Update Kubernetes manifests
          if [ -f "environments/${ENV}/${{ env.PROJECT_NAME }}/kustomization.yaml" ]; then
            sed -i "s|newTag:.*|newTag: ${VERSION}|g" \
              "environments/${ENV}/${{ env.PROJECT_NAME }}/kustomization.yaml"
          fi
          
          # Update Helm values
          if [ -f "environments/${ENV}/${{ env.PROJECT_NAME }}/values.yaml" ]; then
            yq e ".image.tag = \"${VERSION}\"" -i \
              "environments/${ENV}/${{ env.PROJECT_NAME }}/values.yaml"
          fi
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy ${{ env.PROJECT_NAME }} ${VERSION} to ${ENV}" || echo "No changes"
          git push

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      - name: Sync ArgoCD application
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }} \
            --grpc-web \
            --insecure
          
          APP_NAME="${{ env.PROJECT_NAME }}-${{ needs.preflight.outputs.environment }}"
          
          # Trigger sync
          argocd app sync ${APP_NAME} --prune --force
          
          # Wait for sync and health
          argocd app wait ${APP_NAME} --health --timeout 300

  # ============================================
  # DEPLOY WITH OCTOPUS DEPLOY
  # ============================================
  deploy-octopus:
    name: Deploy with Octopus
    runs-on: ubuntu-latest
    needs: [preflight, container-build, publish-artifacts]
    if: needs.preflight.outputs.should_deploy == 'true' && needs.preflight.outputs.environment == 'prod'
    environment: production
    steps:
      - name: Install Octopus CLI
        uses: OctopusDeploy/install-octopus-cli-action@v3
        with:
          version: latest

      - name: Create Octopus release
        uses: OctopusDeploy/create-release-action@v3
        with:
          server: ${{ secrets.OCTOPUS_SERVER_URL }}
          api_key: ${{ secrets.OCTOPUS_API_KEY }}
          project: ${{ env.PROJECT_NAME }}
          release_number: ${{ needs.preflight.outputs.version }}
          package_version: ${{ needs.preflight.outputs.version }}
          packages: |
            ${{ env.PROJECT_NAME }}:${{ needs.preflight.outputs.version }}

      - name: Deploy Octopus release
        uses: OctopusDeploy/deploy-release-action@v3
        with:
          server: ${{ secrets.OCTOPUS_SERVER_URL }}
          api_key: ${{ secrets.OCTOPUS_API_KEY }}
          project: ${{ env.PROJECT_NAME }}
          release_number: ${{ needs.preflight.outputs.version }}
          environments: |
            Production

      - name: Wait for deployment
        uses: OctopusDeploy/await-task-action@v3
        with:
          server: ${{ secrets.OCTOPUS_SERVER_URL }}
          api_key: ${{ secrets.OCTOPUS_API_KEY }}

  # ============================================
  # DATADOG DORA METRICS
  # ============================================
  dora-metrics:
    name: DORA Metrics
    runs-on: ubuntu-latest
    needs: [preflight, deploy-argocd]
    if: always() && needs.preflight.outputs.should_deploy == 'true'
    steps:
      - name: Send deployment event to Datadog
        run: |
          DEPLOY_STATUS="success"
          if [[ "${{ needs.deploy-argocd.result }}" != "success" ]]; then
            DEPLOY_STATUS="failure"
          fi
          
          curl -X POST "https://api.datadoghq.com/api/v1/events" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
            -d @- << EOF
          {
            "title": "Deployment: ${{ env.PROJECT_NAME }} v${{ needs.preflight.outputs.version }}",
            "text": "Deployed to ${{ needs.preflight.outputs.environment }} environment",
            "priority": "normal",
            "tags": [
              "service:${{ env.PROJECT_NAME }}",
              "environment:${{ needs.preflight.outputs.environment }}",
              "version:${{ needs.preflight.outputs.version }}",
              "status:${DEPLOY_STATUS}",
              "team:bcg",
              "language:dotnet"
            ],
            "alert_type": "info",
            "source_type_name": "github"
          }
          EOF

      - name: Track DORA deployment frequency
        run: |
          curl -X POST "https://api.datadoghq.com/api/v2/series" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
            -d @- << EOF
          {
            "series": [{
              "metric": "dora.deployment.frequency",
              "type": "count",
              "points": [{
                "timestamp": $(date +%s),
                "value": 1
              }],
              "tags": [
                "service:${{ env.PROJECT_NAME }}",
                "environment:${{ needs.preflight.outputs.environment }}",
                "language:dotnet"
              ]
            }]
          }
          EOF

      - name: Track lead time for changes
        run: |
          # Calculate lead time from commit to deploy
          COMMIT_TIME=$(git log -1 --format=%ct)
          DEPLOY_TIME=$(date +%s)
          LEAD_TIME=$((DEPLOY_TIME - COMMIT_TIME))
          
          curl -X POST "https://api.datadoghq.com/api/v2/series" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
            -d @- << EOF
          {
            "series": [{
              "metric": "dora.lead_time_for_changes",
              "type": "gauge",
              "points": [{
                "timestamp": $(date +%s),
                "value": ${LEAD_TIME}
              }],
              "tags": [
                "service:${{ env.PROJECT_NAME }}",
                "environment:${{ needs.preflight.outputs.environment }}",
                "language:dotnet"
              ],
              "unit": "second"
            }]
          }
          EOF

  # ============================================
  # NOTIFICATIONS
  # ============================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [preflight, build, sonarqube, container-build, deploy-argocd]
    if: always()
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.build.result }}" == "failure" ]] || \
             [[ "${{ needs.sonarqube.result }}" == "failure" ]] || \
             [[ "${{ needs.container-build.result }}" == "failure" ]] || \
             [[ "${{ needs.deploy-argocd.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
            echo "emoji=:x:" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
            echo "emoji=:white_check_mark:" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "${{ steps.status.outputs.emoji }} .NET Pipeline: ${{ env.PROJECT_NAME }}"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {"type": "mrkdwn", "text": "*Status:*\n${{ steps.status.outputs.status }}"},
                        {"type": "mrkdwn", "text": "*Version:*\n${{ needs.preflight.outputs.version }}"},
                        {"type": "mrkdwn", "text": "*Environment:*\n${{ needs.preflight.outputs.environment }}"},
                        {"type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}"},
                        {"type": "mrkdwn", "text": "*Coverage:*\n${{ needs.build.outputs.test_coverage }}%"},
                        {"type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }}"}
                      ]
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {"type": "plain_text", "text": "View Pipeline"},
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        },
                        {
                          "type": "button",
                          "text": {"type": "plain_text", "text": "View SonarQube"},
                          "url": "${{ secrets.SONAR_HOST_URL }}/dashboard?id=${{ env.PROJECT_NAME }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ============================================
  # ROLLBACK JOB
  # ============================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [preflight, deploy-argocd]
    if: failure() && needs.preflight.outputs.should_deploy == 'true'
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      - name: Rollback ArgoCD application
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }} \
            --grpc-web \
            --insecure
          
          APP_NAME="${{ env.PROJECT_NAME }}-${{ needs.preflight.outputs.environment }}"
          
          # Get previous revision and rollback
          argocd app rollback ${APP_NAME} 1
          
          # Wait for rollback
          argocd app wait ${APP_NAME} --health --timeout 300

      - name: Track rollback in Datadog
        run: |
          curl -X POST "https://api.datadoghq.com/api/v2/series" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
            -d @- << EOF
          {
            "series": [{
              "metric": "dora.change_failure_rate",
              "type": "count",
              "points": [{
                "timestamp": $(date +%s),
                "value": 1
              }],
              "tags": [
                "service:${{ env.PROJECT_NAME }}",
                "environment:${{ needs.preflight.outputs.environment }}",
                "language:dotnet"
              ]
            }]
          }
          EOF

      - name: Send rollback notification
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "warning",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": ":warning: ROLLBACK: ${{ env.PROJECT_NAME }}"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "Deployment of version *${{ needs.preflight.outputs.version }}* to *${{ needs.preflight.outputs.environment }}* failed.\nAutomatic rollback initiated."
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {"type": "plain_text", "text": "View Failed Pipeline"},
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                          "style": "danger"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
